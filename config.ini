[dependency-graph]
; Имя анализируемого пакета
package_name = E
; URL репозитория пакетов или (в тестовом режиме) путь к файлу графа
repository = tests/data/diamond.txt
; Режим работы с тестовым репозиторием: true или false
test_mode = true
; Вывод зависимостей в виде ASCII-дерева: true или false
ascii_tree = false
; Максимальная глубина анализа зависимостей (целое число, не меньше 1)
max_depth = 3
